# Moves an npm dist-tag (next, latest) of every @xoong package to a version that is already published. MANUAL ONLY.
#
# Run it from the Actions tab ("Run workflow"). It defaults to a dry run (it lists what it would do and changes nothing).
# It uses npm Trusted Publishing (OIDC), like publish.yml. On npmjs.com each package's trusted publisher is registered for the workflow file
# `publish.yml` and must be allowed to run `npm dist-tag` (the "Allow npm dist-tag" box). If npm refuses a dist-tag coming from this file
# because its name is a different one, register `dist-tag.yml` as a second trusted publisher of the packages (docs/publishing.md).
# The packages are the folders of packages/: a package added later is moved too.
name: dist-tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The published version the tag should point at (for example 0.0.57)'
        type: string
        required: true
      tag:
        description: 'The dist-tag to move (next while xoong is 0.0.x, or latest)'
        type: string
        default: next
      dry_run:
        description: 'Dry run: list what would change, change nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing

jobs:
  dist-tag:
    runs-on: ubuntu-latest # OIDC needs a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Move the tag
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          npm --version
          case "$VERSION" in (*[!0-9A-Za-z.+-]*|"") echo "bad version: $VERSION"; exit 1;; esac
          case "$TAG" in (*[!0-9A-Za-z._-]*|"") echo "bad tag: $TAG"; exit 1;; esac
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            echo "::group::$name"
            if [ -z "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is not published: stopping, nothing is moved for the packages after this one"
              exit 1
            fi
            echo "now: $(npm view "$name" dist-tags --json | tr -d '\n ')"
            if [ "$DRY" = "true" ]; then
              echo "(dry run) npm dist-tag add $name@$VERSION $TAG"
            else
              npm dist-tag add "$name@$VERSION" "$TAG"
            fi
            echo "::endgroup::"
          done
