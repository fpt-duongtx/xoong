# Publishes the packages to npm. MANUAL ONLY: nothing here runs by itself.
#
# Run it from the Actions tab ("Run workflow"). It defaults to a dry run (npm checks everything and uploads nothing).
# A real run needs `dry_run` switched off. It publishes with npm Trusted Publishing (OIDC): each package has this repository and
# workflow registered as a trusted publisher on npmjs.com, so no token is stored (see docs/publishing.md).
# The packages are published in dependency order, with provenance (npm shows that they were built from this repository).
name: publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check and pack, upload nothing'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag to publish under (next while xoong is 0.0.x; promote to latest later)'
        type: string
        default: next

permissions:
  contents: read
  id-token: write # for provenance

jobs:
  publish:
    runs-on: ubuntu-latest # npm Trusted Publishing (OIDC) needs a GitHub-hosted runner; CI and Pages run on the home server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint and test
        run: |
          npm run lint
          npx vitest run
      - name: Publish in dependency order
        env:
          DRY: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
        run: |
          flag=""
          if [ "$DRY" = "true" ]; then flag="--dry-run"; fi
          for p in core data forms i18n ui controls richtext server cli test ssr mcp lsp xoong; do
            echo "::group::$p"
            npm publish -w "packages/$p" --provenance --access public --tag "$TAG" $flag
            echo "::endgroup::"
          done
