name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Real-browser tests drive Chromium through Playwright.
      - run: npx playwright install --with-deps chromium
      - name: Lint (no-shadow)
        run: npm run lint
      - name: Tests with coverage (thresholds enforced)
        run: npm run test:coverage
      - name: Type-check generated types for the sample specs
        run: |
          mkdir -p .tmp && node packages/cli/src/cli.js sync examples/chat/openapi.json --hints examples/chat/xoong.hints.json --out .tmp
          npx tsc --noEmit --strict --target es2022 .tmp/api.d.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage

  # The same real-browser tests (router, shell, form controls, build under a strict CSP, prerendering, the admin example) in the other engines of the
  # supported matrix (docs/browser-support.md). Chromium runs in the job above.
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests in ${{ matrix.browser }}
        run: npm run test:browsers
        env:
          XOONG_BROWSER: ${{ matrix.browser }}
