# The documentation site (site/) on GitHub Pages, built with xoong itself (`xoong build`, strict CSP output).
# Pages is enabled for the repository (Settings > Pages > Source: GitHub Actions). The site follows main (pushes that change site/ or docs/);
# it can also be run by hand (Actions > Pages > Run workflow).
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, xoong-home]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site
        run: |
          node packages/cli/src/cli.js sync site/demo/openapi.json --hints site/demo/xoong.hints.json --out site/.xoong
          node packages/cli/src/cli.js build --root site --out _site --base "/${{ github.event.repository.name }}" --include img --include brand --include fonts --include reference.json --include search-index.json --include llms.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
