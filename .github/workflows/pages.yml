# The documentation site (site/) on GitHub Pages, built with xoong itself (`xoong build`, strict CSP output).
# Run it by hand (Actions > Pages > Run workflow) once Pages is enabled for the repository (Settings > Pages > Source: GitHub Actions).
# When the site should follow main, add `push: { branches: [main], paths: [site/**, docs/**] }` under `on`.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site
        run: |
          node packages/cli/src/cli.js sync site/demo/openapi.json --hints site/demo/xoong.hints.json --out site/.xoong
          node packages/cli/src/cli.js build --root site --out _site --base "/${{ github.event.repository.name }}" --include img --include brand --include fonts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
