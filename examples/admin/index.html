<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/@xoong/ui/src/xoong.css">
  <link rel="stylesheet" href="/src/app.css">
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="xo-admin">
  <header><strong>Team admin</strong></header>
  <nav aria-label="Main">
    <a href="/" aria-current="page">People</a>
  </nav>
  <main>
    <h1>People</h1>
    <button xo-open="#add">Add a person</button>

    <xo-view live get="/users">
      <p xo-if="$loading">Loading…</p>
      <p xo-if="$error" class="xo-error" role="alert">{$error.code}: {$error.detail}</p>
      <xo-table columns="name,email:E-mail,role,status" sortable page-size="2">
        <button xo-click="POST /users/{id}/disable">Disable</button>
        <button xo-click="DELETE /users/{id}" class="danger">Delete</button>
      </xo-table>
    </xo-view>

    <xo-dialog id="add">
      <h2>Add a person</h2>
      <xo-view>
        <xo-form op="POST /users" submit="Add"></xo-form>
      </xo-view>
      <button xo-close>Cancel</button>
    </xo-dialog>
  </main>
</body>
</html>
