<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Articles</title></head>
<body><main><h1>Articles</h1>
<xo-view get="/articles" p-limit="5" p-offset="0">
<p><button xo-param="status=draft">Draft</button> <button xo-param="status=published">Published</button></p>
<ul><li xo-each="items">{title}</li></ul>
<p><button xo-param="offset-=5" xo-if="$hasPrev">Previous</button> <button xo-param="offset+=5" xo-if="$hasNext">Next</button></p>
</xo-view></main></body></html>
