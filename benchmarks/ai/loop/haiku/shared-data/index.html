<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/@xoong/ui/src/xoong.css">
  <style>
    @layer dashboard {
      .dashboard { display: grid; gap: 2rem; padding: 1rem; }
      .dashboard section { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ccc; }
    }
  </style>
</head>
<body class="xo-admin">
  <main class="dashboard">
    <section>
      <h2>Orders</h2>
      <xo-view get="listOrders" live>
        <p xo-if="$loading">Loading orders…</p>
        <p xo-if="$error">{$error.code}: {$error.detail}</p>
        <table>
          <thead>
            <tr><th>ID</th><th>Total</th><th>Customer</th></tr>
          </thead>
          <tbody>
            <tr xo-each="items">
              <td>{id}</td>
              <td>{total}</td>
              <td>{customer.name}</td>
            </tr>
          </tbody>
        </table>
      </xo-view>
    </section>

    <section>
      <h2>Customers</h2>
      <xo-view get="listCustomers" live>
        <p xo-if="$loading">Loading customers…</p>
        <p xo-if="$error">{$error.code}: {$error.detail}</p>
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th></tr>
          </thead>
          <tbody>
            <tr xo-each=".">
              <td>{name}</td>
              <td>{email}</td>
            </tr>
          </tbody>
        </table>
      </xo-view>
    </section>
  </main>
</body>
</html>
