<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users</title>
  <link rel="stylesheet" href="/@xoong/ui/src/xoong.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="/src/main.ts"></script>
  <script type="module">import '@xoong/ui';</script>
</head>
<body class="xo-admin">
  <header>
    <h1>Users</h1>
  </header>

  <main>
    <section class="panel">
      <h2>Add a user</h2>
      <xo-view>
        <form xo-submit="createUser" class="add-user">
          <label>Name <input name="name" required></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Role <input name="role" required placeholder="e.g. admin"></label>
          <button type="submit">Add user</button>
        </form>
      </xo-view>
    </section>

    <section class="panel">
      <h2>All users</h2>
      <xo-view get="/users" live>
        <p class="error" xo-if="$error">{$error.code}: {$error.detail}</p>
        <xo-table columns="name:Name,email:Email,role:Role,status:Status" empty="No users">
          <span slot="status" class="badge">{status}</span>
          <button xo-click="POST /users/{id}/disable">Disable</button>
          <button xo-click="DELETE /users/{id}" xo-confirm="Delete {name}?" xo-confirm-kind="danger">Delete</button>
        </xo-table>
      </xo-view>
    </section>
  </main>
</body>
</html>
