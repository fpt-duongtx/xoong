<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post</title>
</head>
<body>
  <main>
    <p><a href="index.html">Back to all posts</a></p>
    <xo-view get="getPost" p-id="?id">
      <p xo-if="$loading">Loading…</p>
      <p xo-if="$error">{$error.code}: {$error.detail}</p>
      <article>
        <h1>{title}</h1>
        <p>{body}</p>
      </article>
    </xo-view>
  </main>
</body>
</html>
