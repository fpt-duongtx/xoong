<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
</head>
<body>
  <main>
    <h1>Blog</h1>
    <xo-view get="listPosts">
      <p xo-if="$loading">Loading…</p>
      <p xo-if="$error">{$error.code}: {$error.detail}</p>
      <ul>
        <li xo-each=".">
          <a href="post.html?id={id}">{title}</a>
          <span>by {author}</span>
        </li>
      </ul>
    </xo-view>
  </main>
</body>
</html>
