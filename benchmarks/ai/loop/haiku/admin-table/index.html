<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff</title>
  <link rel="stylesheet" href="/@xoong/ui/src/xoong.css">
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="xo-admin">
  <header>
    <h1>Staff</h1>
    <button xo-open="#add-staff">Add staff</button>
  </header>

  <main>
    <xo-view get="listStaff">
      <xo-table columns="name:Name,email:Email,role:Role" sortable filters="name:Search" page-size="10" empty="No staff">
      </xo-table>
    </xo-view>
  </main>

  <xo-dialog id="add-staff" heading="Add staff" dismiss>
    <xo-view>
      <xo-form op="createStaff" submit="Add"></xo-form>
    </xo-view>
  </xo-dialog>
</body>
</html>
